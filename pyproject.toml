[project]
name = "figfoundry"
version = "0.2.0"
description = "WYSIWYG matplotlib figure composer: load data (.npz/.pkl), drag signals onto a canvas to build plots, and export clean reproducible code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tai Duc Nguyen", email = "taiducnguyen.drexel@gmail.com" }]
keywords = ["matplotlib", "figures", "plotting", "wysiwyg", "data-visualization", "scientific-figures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.9",
    "numpy>=1.24",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.0"]

[project.urls]
Homepage = "https://github.com/ductai199x/figfoundry"
Repository = "https://github.com/ductai199x/figfoundry"
Issues = "https://github.com/ductai199x/figfoundry/issues"

[project.scripts]
figfoundry = "figfoundry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["figfoundry"]

[tool.hatch.build.targets.sdist]
# tests/ is dev-only; media/ (README screenshots) and .github/ (CI) are not
# needed to install the package, so keep them out of the source distribution.
exclude = ["tests", "media", ".github", "dist"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "SIM", "UP", "RUF"]
ignore = [
    "E501",   # codegen emits long single-line matplotlib calls on purpose
    "B008",   # FastAPI File(...) as a default argument is idiomatic
    "SIM117", # nested with-statements are fine here
]
