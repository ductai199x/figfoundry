[project]
name = "figfoundry"
version = "0.1.0"
description = "WYSIWYG matplotlib figure composer: load data (.npz/.pkl), drag signals onto a canvas to build plots, and export clean reproducible code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tai D. Nguyen" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
figfoundry = "figfoundry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["figfoundry"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "SIM", "UP", "RUF"]
ignore = [
    "E501",   # codegen emits long single-line matplotlib calls on purpose
    "B008",   # FastAPI File(...) as a default argument is idiomatic
    "SIM117", # nested with-statements are fine here
]
